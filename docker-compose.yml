version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: aicodereview_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aicodereview
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # Backend / frontend containers are still commented out as before (run them locally, see README).
  # backend: environment to pass when you enable it (values come from your .env, never hard-coded):
  #   DB_URL=jdbc:mysql://db:3306/aicodereview  DB_USER  DB_PASSWORD  JWT_SECRET
  #   GITHUB_CLIENT_ID  GITHUB_CLIENT_SECRET  GITHUB_REDIRECT_URI  LLM_PROVIDER  LLM_API_KEY  FRONTEND_URL

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
